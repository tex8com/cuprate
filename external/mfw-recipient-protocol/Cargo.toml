[package]
name = "mfw-recipient-protocol"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = []

[dependencies]
curve25519-dalek = "4.1.3"
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde", "zeroize"] }
getrandom = "0.2"
hex = "0.4"
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "hkdfsha2", "chacha"] }
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
voprf = { version = "=0.5.0", default-features = false, features = ["alloc", "ristretto255-ciphersuite", "serde", "std"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
